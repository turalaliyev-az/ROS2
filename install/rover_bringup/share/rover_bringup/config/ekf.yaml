ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel encoders: trustworthy for x/y translation and forward speed,
    # but NOT for yaw -- a hand-spun or slipping wheel reports rotation
    # that never physically happened (see 2026-09-21 discussion). Yaw and
    # vyaw are left to the IMU gyro below instead.
    odom0: wheel_odom
    odom0_config: [true,  true,  false,
                   false, false, false,
                   true,  false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU gyro: doesn't care whether the wheels slipped, so it's the more
    # reliable source for how fast the robot is actually turning. Only
    # angular_velocity.z is fused -- orientation is marked invalid by the
    # publisher (no magnetometer, yaw drifts) and linear_acceleration is
    # left unused since it's not needed for a ground robot in 2D mode.
    imu0: imu/data_raw
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
